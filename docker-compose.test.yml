services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cygnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-energy_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cygnet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CYGNET_VERSION: ${CYGNET_VERSION:-1.0.1}
    command: >
      sh -lc "poetry run alembic upgrade head &&
      poetry run uvicorn src.api.main:app --host 0.0.0.0 --port 8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cygnet}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-energy_db}
      API_TOKEN: ${API_TOKEN:-test-token}
      ENTSOE_API_TOKEN: ${ENTSOE_API_TOKEN:-test-token}
      EIA_API_KEY: ${EIA_API_KEY:-test-key}
      AUTH_BYPASS_DEV: "true"
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8001/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 3000
    environment:
      VITE_PROXY_TARGET: http://api:8001
      VITE_API_BASE_URL: http://127.0.0.1:8001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CYGNET_VERSION: ${CYGNET_VERSION:-1.0.1}
    command: streamlit run main_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cygnet}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-energy_db}
      CYGNET_API_URL: http://api:8001
      API_TOKEN: ${API_TOKEN:-test-token}
      ENTSOE_API_TOKEN: ${ENTSOE_API_TOKEN:-test-token}
      EIA_API_KEY: ${EIA_API_KEY:-test-key}
      AUTH_BYPASS_DEV: "true"
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8501/_stcore/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  pytest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CYGNET_VERSION: ${CYGNET_VERSION:-1.0.1}
    command: >
      sh -lc "poetry install --with dev --no-interaction --no-ansi &&
      pytest -v tests/api tests/services tests/test_api.py tests/test_regions_route.py tests/test_db_connection.py"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cygnet}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-energy_db}
      API_TOKEN: ${API_TOKEN:-test-token}
      ENTSOE_API_TOKEN: ${ENTSOE_API_TOKEN:-test-token}
      EIA_API_KEY: ${EIA_API_KEY:-test-key}
      AUTH_BYPASS_DEV: "true"
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - .:/app

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run test:run
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

  streamlit-test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CYGNET_VERSION: ${CYGNET_VERSION:-1.0.1}
    command: >
      sh -lc "poetry install --with dev --no-interaction --no-ansi &&
      pytest -v tests/streamlit"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cygnet}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-energy_db}
      API_TOKEN: ${API_TOKEN:-test-token}
      ENTSOE_API_TOKEN: ${ENTSOE_API_TOKEN:-test-token}
      EIA_API_KEY: ${EIA_API_KEY:-test-key}
      AUTH_BYPASS_DEV: "true"
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  frontend-node-modules:
