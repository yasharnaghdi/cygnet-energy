name: Cygnet Full Stack CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install backend dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Run backend tests
        env:
          API_TOKEN: test-token
          ENTSOE_API_TOKEN: test-token
          EIA_API_KEY: test-key
          AUTH_BYPASS_DEV: "true"
          DATABASE_URL: postgresql://user:pass@localhost:5432/cygnet_energy
        run: poetry run pytest -v tests/api tests/services tests/test_api.py tests/test_regions_route.py tests/test_db_connection.py --cov=src --cov-report=xml

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm run test:run

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install backend dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Run Streamlit parity tests
        env:
          API_TOKEN: test-token
          ENTSOE_API_TOKEN: test-token
          EIA_API_KEY: test-key
          AUTH_BYPASS_DEV: "true"
          DATABASE_URL: postgresql://user:pass@localhost:5432/cygnet_energy
        run: poetry run pytest -v tests/streamlit

  stack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose -p cygnet-ci -f docker-compose.test.yml up -d postgres api frontend app

      - name: Run smoke checks
        run: ./scripts/stack_smoke.sh

      - name: Show service logs on failure
        if: failure()
        run: docker compose -p cygnet-ci -f docker-compose.test.yml logs --tail=200

      - name: Stop stack
        if: always()
        run: docker compose -p cygnet-ci -f docker-compose.test.yml down -v

  deploy-staging:
    needs:
      - backend
      - frontend
      - streamlit
      - stack-smoke
    if: github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync staging frontend artifact
        run: aws s3 sync dist/ "${{ secrets.STAGING_FRONTEND_S3_URI }}" --delete
