version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cygnet-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cygnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-energy_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cygnet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CYGNET_VERSION: ${CYGNET_VERSION:-1.0.1}
    container_name: cygnet-api
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cygnet:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-energy_db}}
      EIA_API_KEY: ${EIA_API_KEY:-}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-cygnet-api}
      OIDC_REQUIRED_SCOPES: ${OIDC_REQUIRED_SCOPES:-api.read}
      OIDC_REQUIRED_ROLES: ${OIDC_REQUIRED_ROLES:-analyst}
      OIDC_JWKS_CACHE_SECONDS: ${OIDC_JWKS_CACHE_SECONDS:-300}
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CYGNET_VERSION: ${CYGNET_VERSION:-1.0.1}
    container_name: cygnet-app
    command: ["streamlit", "run", "main_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cygnet:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-energy_db}}
      ENTSOE_API_TOKEN: ${ENTSOE_API_TOKEN:-your-token-here}
      EIA_API_KEY: ${EIA_API_KEY:-}
      CYGNET_API_URL: http://api:8000
      PYTHONUNBUFFERED: 1
    depends_on:
      api:
        condition: service_started
    networks:
      - backend
    expose:
      - "8501"
    restart: unless-stopped

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: cygnet-oauth2-proxy
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_ISSUER_URL:-${OIDC_ISSUER}}
      OAUTH2_PROXY_SCOPE: ${OAUTH2_PROXY_SCOPE:-openid profile email}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_UPSTREAMS: http://app:8501/
      OAUTH2_PROXY_WHITELIST_DOMAIN: .example.com
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
    networks:
      - backend
      - edge
    restart: unless-stopped
    expose:
      - "4180"

  reverse-proxy:
    image: nginx:1.25
    container_name: cygnet-reverse-proxy
    depends_on:
      - oauth2-proxy
      - api
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
    networks:
      - edge
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
